[project]
name = "myStandard_Library"
version = "0.1.0"
description = "Standard library to be used in multiple projects."
requires-python = ">=3.10"
authors = [{name="HS Wee"}]
dependencies = [
    "pandas",
    "psutil",
    "psycopg[binary]>=3.1,<4",
    "PyMySQL",
    "PyYAML",
    "python-dotenv",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Changelog = "https://github.com/hswee92/myStandard-Library/blob/main/Changelog.md"



